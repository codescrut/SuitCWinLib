name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-24.04,     lib: libsuitc.so,    ldflags: "-shared -fvisibility=hidden" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, lib: libsuitc.so,    ldflags: "-shared -fvisibility=hidden" }
          - { name: macos-arm64, os: macos-15,         lib: libsuitc.dylib, ldflags: "-dynamiclib -fvisibility=hidden" }
          - { name: macos-x64,   os: macos-15-intel,   lib: libsuitc.dylib, ldflags: "-dynamiclib -fvisibility=hidden" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # SUITCAPP=1 matches the Windows DLL (SuitCLib.vcxproj sets SUITCAPP=YES).
      # SUITCAPP=0 raises NQUIRKS from 4M to 80M and prints the whole analysis
      # to stdout, which a library hosted by BEN or a web service does not want.
      - name: Build
        working-directory: SuitCLib
        run: make -j4 TARGET_LIB=${{ matrix.lib }} LDFLAGS="${{ matrix.ldflags }}" SUITCAPP=1

      - name: Test
        run: python3 tests/run_tests.py SuitCLib/${{ matrix.lib }}

      - name: Package
        run: |
          name="suitclib-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir "$name"
          cp SuitCLib/${{ matrix.lib }} LICENSE README.md AUTHORS.md CHANGELOG.md "$name/"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v5
        with:
          name: suitclib-${{ matrix.name }}
          path: suitclib-*.tar.gz

  windows:
    name: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      - name: Build SuitCLib.dll (x64 and x86)
        shell: cmd
        run: |
          call SuitCLib\build_dll.bat x64 || exit /b 1
          call SuitCLib\build_dll.bat x86 || exit /b 1

      - name: Test (x64)
        run: python tests/run_tests.py SuitCLib/x64/Release/SuitCLib.dll

      - name: Build the demo
        run: dotnet publish Demo -c Release -o demo-out

      - name: Package
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          for arch in x64 x86; do
            name="suitclib-$ref-windows-$arch"
            mkdir "$name"
            src=SuitCLib/x64/Release; [[ $arch == x86 ]] && src=SuitCLib/Release
            cp "$src/SuitCLib.dll" LICENSE README.md AUTHORS.md CHANGELOG.md "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
          done
          name="suitclib-demo-$ref-windows-x64"
          mv demo-out "$name"
          cp LICENSE "$name/"
          7z a -tzip "$name.zip" "$name" > /dev/null

      - uses: actions/upload-artifact@v5
        with:
          name: suitclib-windows
          path: suitclib-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "SuitCWinLib ${GITHUB_REF_NAME#v}" \
            --notes "See CHANGELOG.md for the changes in this release."
